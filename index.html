  <header class="header flex-wrap justify-between">
    <div class="header__wrapper flex justify-between">
      <div class="header__left
        fw-[350]
        shrink-0
        fpl-[20] fpr-[34]
        border-r border-b
        border-gray-500">
        <div class="header__left-img fw-[140] fh-[60]">
          <img class="h-full" src="/content/vexcash.PNG" alt="vexcash logo">
        </div>
        <span class="ffs-[24]">Einfach 60 Tage Geld leihen</span>
      </div>
      <div class="burger shrink-0">
        <div class="burger__item"></div>
        <div class="burger__item"></div>
        <div class="burger__item"></div>
      </div>
    </div>
    <div class="header__right flex w-full border-b border-gray-500">
      <div class="header__right-title
        w-1/2
        fp-[40]
        ffs-[24]">
        Hallo,
        <span class="block text-gray-600 font-medium">John Smith</span>
      </div>
      <div class="header__right-status
        w-1/2
        fp-[40] text-right ffs-[24]">
        Status ihrer Identifizierung
        <span class="block text-emerald-800 font-medium">Identifiziert</span>
      </div>
    </div>
  </header>
