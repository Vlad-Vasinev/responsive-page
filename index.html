<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header class="header flex justify-between">
    <div class="header__left
      fpl-[20] fpr-[40]
      border-r border-b
    border-gray-500">
      <div class="header__left-img fw-[140] fh-[60]">
        <img class="h-full" src="/content/vexcash.PNG" alt="vexcash logo">
      </div>
      <span class="ffs-[24]">Einfach 60 Tage Geld leihen</span>
    </div>
    <div class="header__right flex w-full border-b border-gray-500">
      <div class="header__right-title
        w-1/2
        fp-[40]
        ffs-[24]">
        Hallo,
        <span class="block text-gray-600 font-medium">John Smith</span>
      </div>
      <div class="header__right-status
        w-1/2
        fp-[40] text-right ffs-[24]">
        Status ihrer Identifizierung
        <span class="block text-emerald-800 font-medium">Identifiziert</span>
      </div>
    </div>
  </header>

  <ul class="flex flex-col">
    <li class="fpy-[20] fpx-[30]">
      <button class="flex">
        <svg class="fw-[34] fpr-[6]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path d="M192 112L304 112L304 200C304 239.8 336.2 272 376 272L464 272L464 512C464 520.8 456.8 528 448 528L192 528C183.2 528 176 520.8 176 512L176 128C176 119.2 183.2 112 192 112zM352 131.9L444.1 224L376 224C362.7 224 352 213.3 352 200L352 131.9zM192 64C156.7 64 128 92.7 128 128L128 512C128 547.3 156.7 576 192 576L448 576C483.3 576 512 547.3 512 512L512 250.5C512 233.5 505.3 217.2 493.3 205.2L370.7 82.7C358.7 70.7 342.5 64 325.5 64L192 64zM248 320C234.7 320 224 330.7 224 344C224 357.3 234.7 368 248 368L392 368C405.3 368 416 357.3 416 344C416 330.7 405.3 320 392 320L248 320zM248 416C234.7 416 224 426.7 224 440C224 453.3 234.7 464 248 464L392 464C405.3 464 416 453.3 416 440C416 426.7 405.3 416 392 416L248 416z"/>
        </svg>
        <span>Kredite</span>
      </button>
    </li>
    <li class="fpy-[20] fpx-[30]">
      <button class="flex">
        <svg class="fw-[34] fpr-[6]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path d="M463 448.2C440.9 409.8 399.4 384 352 384L288 384C240.6 384 199.1 409.8 177 448.2C212.2 487.4 263.2 512 320 512C376.8 512 427.8 487.3 463 448.2zM64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320zM320 336C359.8 336 392 303.8 392 264C392 224.2 359.8 192 320 192C280.2 192 248 224.2 248 264C248 303.8 280.2 336 320 336z"/></svg>
        <span>Dokumente hochladen</span>
      </button>
    </li>
    <li class="fpy-[20] fpx-[30]">
      <button class="flex">
        <svg class="fw-[34] fpr-[6]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M125.4 128C91.5 128 64 155.5 64 189.4C64 190.3 64 191.1 64.1 192L64 192L64 448C64 483.3 92.7 512 128 512L512 512C547.3 512 576 483.3 576 448L576 192L575.9 192C575.9 191.1 576 190.3 576 189.4C576 155.5 548.5 128 514.6 128L125.4 128zM528 256.3L528 448C528 456.8 520.8 464 512 464L128 464C119.2 464 112 456.8 112 448L112 256.3L266.8 373.7C298.2 397.6 341.7 397.6 373.2 373.7L528 256.3zM112 189.4C112 182 118 176 125.4 176L514.6 176C522 176 528 182 528 189.4C528 193.6 526 197.6 522.7 200.1L344.2 335.5C329.9 346.3 310.1 346.3 295.8 335.5L117.3 200.1C114 197.6 112 193.6 112 189.4z"/></svg>
        <span>Personliche Daten</span>
      </button>
    </li>
    <li class="fpy-[20] fpx-[30]">
      <button>
        
        <span>E-Mail andern</span>
      </button>
    </li>
    <li class="fpy-[20] fpx-[30]">
      <button>
        
        <span>Kenntwort andern</span>
      </button>
    </li>
    <li class="fpy-[20] fpx-[30]">
      <button>
        
        <span>Kunden Werben</span>
      </button>
    </li>
    <li class="fpy-[20] fpx-[30] border-b border-gray-500">
      <button>
        
        <span>Abmelden</span>
      </button>
    </li>
  </ul>

  <script src="script.js"></script>
</body>
</html>
